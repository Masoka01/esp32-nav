<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ESP32 Navigator</title>
  <!-- PWA: tanpa manifest + service worker, Chrome hanya bisa membuat shortcut,
       bukan aplikasi. Path relatif supaya tetap jalan di domain apa pun. -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="Navigasi jalan/pejalan kaki via Google Maps, dikirim ke ESP32 lewat Bluetooth." />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #4f8ef7;
      --accent2: #2ecc8a;
      --warn: #f7c94f;
      --danger: #f75f5f;
      --text: #e8eaf0;
      --text-muted: #7a7f99;
      --border: #2a2f45;
      --radius: 12px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── TOP PANEL ── */
    #top-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
      z-index: 1000;
      flex-shrink: 0;
      position: relative;
    }

    .app-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      font-family: var(--mono);
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px 10px 36px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    #suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 2000;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }

    .suggestion-item {
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      line-height: 1.4;
    }

    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--surface); color: var(--accent); }

    /* Konfirmasi tujuan hasil parse link Google Maps.
       Pakai token & gaya tombol yang sama dengan .suggestion-item dan
       #btn-start supaya tidak lahir bahasa visual baru. */
    #maps-confirm {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 2001;
      padding: 12px;
      display: none;
    }
    #maps-confirm .mc-name { font-size: 13px; color: var(--text); line-height: 1.4; }
    #maps-confirm .mc-coord {
      font-family: var(--mono); font-size: 12px;
      color: var(--text-muted); margin-top: 4px;
    }
    #maps-confirm .mc-tag {
      display: inline-block; margin-top: 8px;
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-muted);
    }
    #maps-confirm .mc-tag.approx { color: #d8a13a; border-color: #d8a13a; }
    #maps-confirm .mc-actions { display: flex; gap: 8px; margin-top: 10px; }
    #maps-confirm button {
      flex: 1; padding: 9px 12px; font-size: 13px; font-family: var(--font);
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    #maps-confirm button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    #btn-locate, #btn-bookmarklet {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px; height: 40px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }

    #btn-locate:hover, #btn-bookmarklet:hover { border-color: var(--accent); color: var(--accent); }
    #btn-bookmarklet.active { border-color: var(--accent); color: var(--accent); }

    /* Panel bookmarklet — menumpuk di atas peta, tidak mendorong layout. */
    #bookmarklet-panel {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      z-index: 3000;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: none;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
    }
    #bookmarklet-panel .bm-title { font-size: 13px; margin-bottom: 6px; }
    #bookmarklet-panel ol { margin: 0 0 10px; padding-left: 18px; }
    #bookmarklet-panel li { margin-bottom: 4px; }
    #bookmarklet-panel .bm-hint { color: var(--text-muted); }
    #bookmarklet-panel .bm-note {
      color: var(--text-muted); font-size: 11px; line-height: 1.6;
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    }
    #bookmarklet-panel .bm-note:empty { display: none; }
    /* Jalur pengganti untuk platform yang tidak bisa menjalankan bookmarklet. */
    #bm-alt { font-size: 12px; line-height: 1.6; }
    #bm-alt p { margin: 0 0 8px; }
    #bm-alt p:last-child { margin-bottom: 0; }
    #bm-alt b { color: var(--text); }
    #bookmarklet-code {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 8px;
      resize: none;
      overflow: hidden;
    }
    #bookmarklet-panel .bm-actions { display: flex; gap: 8px; margin-top: 10px; }
    #bookmarklet-panel button {
      flex: 1; padding: 9px 12px; font-size: 13px; font-family: var(--font);
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    #bookmarklet-panel button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── MAP ── */
    #map {
      flex: 1;
      min-height: 0;
      z-index: 1;
    }

    /* ── BOTTOM PANEL ── */
    #bottom-panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      z-index: 1000;
      flex-shrink: 0;
    }

    /* BLE status bar */
    #ble-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #ble-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    #ble-dot.connected { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    #ble-dot.connecting { background: var(--warn); animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    #ble-label {
      font-size: 12px;
      color: var(--text-muted);
      flex: 1;
      font-family: var(--mono);
    }

    #btn-ble {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    #btn-ble:hover { border-color: var(--accent); color: var(--accent); }
    #btn-ble.connected { border-color: var(--danger); color: var(--danger); }

    /* Instruction card */
    #instruction-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
    }

    #instr-icon {
      font-size: 26px;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }

    #instr-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
    }

    #instr-dist {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* Route info strip */
    #route-info {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--mono);
      display: flex;
      gap: 16px;
    }

    #route-info span { display: none; }
    #route-info.visible span { display: inline; }

    /* Nav controls */
    #nav-controls {
      display: none;
      margin-top: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    #nav-controls.visible { display: flex; }

    /* Catatan kecil soal layar dijaga. Baris sendiri di bawah tombol,
       hanya muncul selama navigasi berjalan. */
    #awake-note {
      flex-basis: 100%;
      order: 3;
      font-family: var(--font);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-muted);
      text-align: center;
    }
    #awake-note.warn { color: var(--warn); }
    #awake-note.hidden { display: none; }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .nav-btn:active { opacity: 0.7; }
    #btn-start { background: var(--accent); color: #fff; }
    #btn-stop  { background: var(--surface2); color: var(--danger); border: 1px solid var(--danger); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
      left: 50%; transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; }

    /* Leaflet overrides */
    .leaflet-control-attribution { font-size: 9px !important; }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP -->
  <div id="top-panel">
    <div class="app-title">ESP32 NAVIGATOR</div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="text" placeholder="Cari tujuan..." autocomplete="off" />
        <div id="suggestions"></div>
        <div id="maps-confirm"></div>
      </div>
      <button id="btn-locate" title="Lokasi saya">📍</button>
      <button id="btn-bookmarklet" title="Kirim dari Google Maps">🔗</button>
    </div>
    <div id="bookmarklet-panel">
      <div class="bm-title">Kirim tujuan dari Google Maps</div>
      <div id="bm-bm-flow">
        <ol>
          <li>Salin kode di bawah ini.</li>
          <li>Simpan sebagai bookmark bernama <b>Kirim ke ESP-Nav</b>
              <span class="bm-hint" id="bm-save-hint"></span></li>
          <li>Buka lokasi di Google Maps, lalu <span id="bm-run-how"></span>.</li>
        </ol>
        <textarea id="bookmarklet-code" readonly rows="3" spellcheck="false"></textarea>
        <div class="bm-actions">
          <button id="btn-copy-bm" class="primary">Salin kode</button>
          <button id="btn-close-bm">Tutup</button>
        </div>
      </div>
      <div id="bm-alt" style="display:none"></div>
      <div class="bm-note" id="bm-note"></div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- BOTTOM -->
  <div id="bottom-panel">
    <div id="ble-bar">
      <div id="ble-dot"></div>
      <span id="ble-label">ESP32 belum terhubung</span>
      <button id="btn-ble">Hubungkan</button>
    </div>

    <div id="instruction-card">
      <div id="instr-icon">🗺️</div>
      <div id="instr-text">Cari tujuan untuk mulai navigasi</div>
      <div id="instr-dist"></div>
    </div>

    <div id="route-info">
      <span id="info-dist"></span>
      <span id="info-dur"></span>
    </div>

    <div id="nav-controls">
      <button class="nav-btn" id="btn-start">Mulai Navigasi</button>
      <button class="nav-btn" id="btn-stop">Berhenti</button>
      <div id="awake-note" class="hidden"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
