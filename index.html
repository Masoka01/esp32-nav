<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ESP32 Navigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #4f8ef7;
      --accent2: #2ecc8a;
      --warn: #f7c94f;
      --danger: #f75f5f;
      --text: #e8eaf0;
      --text-muted: #7a7f99;
      --border: #2a2f45;
      --radius: 12px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── TOP PANEL ── */
    #top-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
      z-index: 1000;
      flex-shrink: 0;
      position: relative;
    }

    .app-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      font-family: var(--mono);
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px 10px 36px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    #suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 2000;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }

    .suggestion-item {
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      line-height: 1.4;
    }

    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--surface); color: var(--accent); }

    /* Konfirmasi tujuan hasil parse link Google Maps.
       Pakai token & gaya tombol yang sama dengan .suggestion-item dan
       #btn-start supaya tidak lahir bahasa visual baru. */
    #maps-confirm {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      z-index: 2001;
      padding: 12px;
      display: none;
    }
    #maps-confirm .mc-name { font-size: 13px; color: var(--text); line-height: 1.4; }
    #maps-confirm .mc-coord {
      font-family: var(--mono); font-size: 12px;
      color: var(--text-muted); margin-top: 4px;
    }
    #maps-confirm .mc-tag {
      display: inline-block; margin-top: 8px;
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-muted);
    }
    #maps-confirm .mc-tag.approx { color: #d8a13a; border-color: #d8a13a; }
    #maps-confirm .mc-actions { display: flex; gap: 8px; margin-top: 10px; }
    #maps-confirm button {
      flex: 1; padding: 9px 12px; font-size: 13px; font-family: var(--font);
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    #maps-confirm button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    #btn-locate, #btn-bookmarklet {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px; height: 40px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }

    #btn-locate:hover, #btn-bookmarklet:hover { border-color: var(--accent); color: var(--accent); }
    #btn-bookmarklet.active { border-color: var(--accent); color: var(--accent); }

    /* Panel bookmarklet — menumpuk di atas peta, tidak mendorong layout. */
    #bookmarklet-panel {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      z-index: 3000;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: none;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
    }
    #bookmarklet-panel .bm-title { font-size: 13px; margin-bottom: 6px; }
    #bookmarklet-panel ol { margin: 0 0 10px; padding-left: 18px; }
    #bookmarklet-panel li { margin-bottom: 4px; }
    #bookmarklet-panel .bm-hint { color: var(--text-muted); }
    #bookmarklet-code {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 8px;
      resize: none;
      overflow: hidden;
    }
    #bookmarklet-panel .bm-actions { display: flex; gap: 8px; margin-top: 10px; }
    #bookmarklet-panel button {
      flex: 1; padding: 9px 12px; font-size: 13px; font-family: var(--font);
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    #bookmarklet-panel button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── MAP ── */
    #map {
      flex: 1;
      min-height: 0;
      z-index: 1;
    }

    /* ── BOTTOM PANEL ── */
    #bottom-panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      z-index: 1000;
      flex-shrink: 0;
    }

    /* BLE status bar */
    #ble-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #ble-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    #ble-dot.connected { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    #ble-dot.connecting { background: var(--warn); animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    #ble-label {
      font-size: 12px;
      color: var(--text-muted);
      flex: 1;
      font-family: var(--mono);
    }

    #btn-ble {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    #btn-ble:hover { border-color: var(--accent); color: var(--accent); }
    #btn-ble.connected { border-color: var(--danger); color: var(--danger); }

    /* Instruction card */
    #instruction-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
    }

    #instr-icon {
      font-size: 26px;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }

    #instr-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
    }

    #instr-dist {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* Route info strip */
    #route-info {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--mono);
      display: flex;
      gap: 16px;
    }

    #route-info span { display: none; }
    #route-info.visible span { display: inline; }

    /* Nav controls */
    #nav-controls {
      display: none;
      margin-top: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    #nav-controls.visible { display: flex; }

    /* Catatan kecil soal layar dijaga. Baris sendiri di bawah tombol,
       hanya muncul selama navigasi berjalan. */
    #awake-note {
      flex-basis: 100%;
      order: 3;
      font-family: var(--font);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-muted);
      text-align: center;
    }
    #awake-note.warn { color: var(--warn); }
    #awake-note.hidden { display: none; }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .nav-btn:active { opacity: 0.7; }
    #btn-start { background: var(--accent); color: #fff; }
    #btn-stop  { background: var(--surface2); color: var(--danger); border: 1px solid var(--danger); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
      left: 50%; transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; }

    /* Leaflet overrides */
    .leaflet-control-attribution { font-size: 9px !important; }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP -->
  <div id="top-panel">
    <div class="app-title">ESP32 NAVIGATOR</div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="text" placeholder="Cari tujuan..." autocomplete="off" />
        <div id="suggestions"></div>
        <div id="maps-confirm"></div>
      </div>
      <button id="btn-locate" title="Lokasi saya">📍</button>
      <button id="btn-bookmarklet" title="Kirim dari Google Maps">🔗</button>
    </div>
    <div id="bookmarklet-panel">
      <div class="bm-title">Kirim tujuan dari Google Maps</div>
      <ol>
        <li>Salin kode di bawah ini.</li>
        <li>Simpan sebagai bookmark bernama <b>Kirim ke ESP-Nav</b>
            <span class="bm-hint">(Chrome: ⋮ → Bookmark → Edit → More ⋮ → Edit)</span></li>
        <li>Buka lokasi di Google Maps, lalu tap bookmark itu.</li>
      </ol>
      <textarea id="bookmarklet-code" readonly rows="3" spellcheck="false"></textarea>
      <div class="bm-actions">
        <button id="btn-copy-bm" class="primary">Salin kode</button>
        <button id="btn-close-bm">Tutup</button>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- BOTTOM -->
  <div id="bottom-panel">
    <div id="ble-bar">
      <div id="ble-dot"></div>
      <span id="ble-label">ESP32 belum terhubung</span>
      <button id="btn-ble">Hubungkan</button>
    </div>

    <div id="instruction-card">
      <div id="instr-icon">🗺️</div>
      <div id="instr-text">Cari tujuan untuk mulai navigasi</div>
      <div id="instr-dist"></div>
    </div>

    <div id="route-info">
      <span id="info-dist"></span>
      <span id="info-dur"></span>
    </div>

    <div id="nav-controls">
      <button class="nav-btn" id="btn-start">Mulai Navigasi</button>
      <button class="nav-btn" id="btn-stop">Berhenti</button>
      <div id="awake-note" class="hidden"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const state = {
  userLat: null, userLng: null,
  destLat: null, destLng: null,
  destName: null,
  steps: [],
  currentStep: 0,
  navigating: false,
  bleDevice: null,
  bleChar: null,
  wakeLock: null,
  watchId: null,
  routeLayer: null,
  destMarker: null,
  userMarker: null,
};

// BLE UUIDs (harus sama dengan kode ESP32)
const SERVICE_UUID  = '6e400001-b5b3-f393-e0a9-e50e24dcca9e';
const CHAR_UUID     = '6e400002-b5b3-f393-e0a9-e50e24dcca9e';

// ══════════════════════════════════════════════
//  MAP INIT
// ══════════════════════════════════════════════
const map = L.map('map', { zoomControl: false }).setView([-6.2, 106.8], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);

const userIcon = L.divIcon({
  html: '<div style="width:16px;height:16px;background:#4f8ef7;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px #4f8ef7aa"></div>',
  iconSize: [16, 16], iconAnchor: [8, 8], className: '',
});

const destIcon = L.divIcon({
  html: '<div style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px #0008)">📍</div>',
  iconSize: [26, 32], iconAnchor: [13, 32], className: '',
});

// ══════════════════════════════════════════════
//  GEOLOCATION
// ══════════════════════════════════════════════
function setUserPos(lat, lng) {
  state.userLat = lat; state.userLng = lng;
  if (state.userMarker) state.userMarker.setLatLng([lat, lng]);
  else state.userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
  if (state.navigating) checkStepProgress(lat, lng);
}

function locateMe() {
  if (!navigator.geolocation) { toast('GPS tidak tersedia'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    setUserPos(lat, lng);
    map.setView([lat, lng], 15);
  }, () => toast('Tidak bisa mendapatkan lokasi'));
}

document.getElementById('btn-locate').addEventListener('click', locateMe);

// Init locate on load
locateMe();

// ══════════════════════════════════════════════
//  SEARCH / NOMINATIM
// ══════════════════════════════════════════════
const searchInput   = document.getElementById('search-input');
const suggestionsEl = document.getElementById('suggestions');
let searchTimer;

// Cache hasil geocoding supaya ketik ulang tidak memukul Nominatim lagi.
// Kebijakan usage Nominatim maksimal 1 request/detik, jadi debounce di
// bawah WAJIB 1000ms dan tidak boleh dilewati oleh cache.
const geocodeCache = new Map();

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 3) { suggestionsEl.style.display = 'none'; return; }
  if (geocodeCache.has(q)) { renderSuggestions(geocodeCache.get(q)); return; }
  searchTimer = setTimeout(() => fetchSuggestions(q), 1000);
});

async function fetchSuggestions(q) {
  if (geocodeCache.has(q)) { renderSuggestions(geocodeCache.get(q)); return; }
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&countrycodes=id`;
    const res  = await fetch(url, { headers: { 'Accept-Language': 'id' } });
    const data = await res.json();
    geocodeCache.set(q, data);
    renderSuggestions(data);
  } catch { toast('Gagal mencari lokasi'); }
}

function renderSuggestions(items) {
  suggestionsEl.innerHTML = '';
  if (!items.length) { suggestionsEl.style.display = 'none'; return; }
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'suggestion-item';
    div.textContent = item.display_name;
    div.addEventListener('click', () => {
      searchInput.value = item.display_name;
      suggestionsEl.style.display = 'none';
      selectDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
    });
    suggestionsEl.appendChild(div);
  });
  suggestionsEl.style.display = 'block';
}

document.addEventListener('click', e => {
  // Panel bookmarklet ikut dikecualikan: tanpa ini, klik tombolnya akan
  // membuka panel lalu langsung menutupnya lagi di handler document ini.
  if (e.target.closest('.search-wrap') || e.target.closest('#bookmarklet-panel')
      || e.target.closest('#btn-bookmarklet')) return;
  suggestionsEl.style.display = 'none';
  hideConfirm();
  toggleBookmarkletPanel(false);
});

// ══════════════════════════════════════════════
//  PARSE LINK GOOGLE MAPS
// ══════════════════════════════════════════════
//
// Format URL Google Maps tidak terdokumentasi resmi dan sudah beberapa kali
// berubah bentuk, jadi ini parser best-effort berlapis fallback.
//
// ⚠️ ATURAN YANG SUDAH DIBUKTIKAN DENGAN DATA ASLI:
// Pasangan !3d/!4d boleh ber-prefix !8m2, dan itu JUSTRU encoding standar
// untuk pin tempat. Link milik user (WH-2 ARCHER) hanya punya satu pair dan
// ber-prefix !8m2. Kalau prefix !8m2 dilewati, link itu jadi nol hasil lalu
// jatuh ke '@' yang berbeda ~284 meter. Jadi: ambil pair PERTAMA, tanpa
// pengecualian berdasarkan prefix.
const MAPS_NUM = '-?\\d+(?:\\.\\d+)?';

function validLatLng(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng)
      && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

function parseMapsLink(text) {
  const raw = String(text || '').trim();
  if (!raw) return { ok: false, reason: 'not-a-link' };

  // Short link tidak bisa di-expand dari browser: CORS melarang membaca
  // target redirect. Harus dibuka sekali di Chrome lalu disalin dari address bar.
  if (/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)(\/|$)/i.test(raw))
    return { ok: false, reason: 'short-link' };

  let u;
  try { u = new URL(raw); } catch { return { ok: false, reason: 'not-a-link' }; }

  // eTLD+1 harus benar-benar milik Google. Dicek per-label, bukan pola
  // string, supaya 'google.com.evil.example' dan 'notgoogle.com' ditolak.
  const labels = u.hostname.toLowerCase().split('.');
  const isGoogle = labels.slice(-2).includes('google') || labels.slice(-3).includes('google');
  if (!isGoogle || !u.pathname.includes('/maps'))
    return { ok: false, reason: 'not-a-link' };

  const safeDec = t => { try { return decodeURIComponent(t); } catch { return t; } };
  const dec     = t => { try { return decodeURIComponent(t.replace(/\+/g, ' ')); } catch { return t.replace(/\+/g, ' '); } };
  const s = safeDec(raw);

  const coordPair = str => {
    const m = String(str).trim().match(new RegExp(`^(${MAPS_NUM})\\s*,\\s*(${MAPS_NUM})$`));
    if (!m) return null;
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    return validLatLng(lat, lng) ? { lat, lng } : null;
  };

  // ── Nama ──────────────────────────────────────────────────────────────
  // Penting: link WH-2 ARCHER tidak punya !2s sama sekali — namanya hanya
  // ada di path /place/. Jadi sumber nama dari path itu wajib, bukan pelengkap.
  const m2s    = s.match(/!2s([^!]+)/);
  const mPlace = s.match(/\/place\/([^/@?]+)/);
  // Tujuan pada /dir/ adalah segmen TERAKHIR, bukan yang pertama.
  const dirSegs = (u.pathname.split('/dir/')[1] || '').split('/')
    .filter(x => x && !x.startsWith('@') && !x.includes('=')).map(dec);
  const dirDest  = dirSegs.length ? dirSegs[dirSegs.length - 1] : '';
  const dirCoord = coordPair(dirDest);
  // 'query' adalah nama parameter pada format resmi Maps URLs API
  // (?api=1&query=...), jadi harus ikut dibaca di samping q/ll/daddr.
  const qVal   = (u.searchParams.get('query') || u.searchParams.get('q')
               || u.searchParams.get('ll') || u.searchParams.get('daddr') || '').trim();
  const qCoord = coordPair(qVal);
  // Tujuan /dir/ berupa nama, bukan koordinat. Penting untuk keputusan di bawah.
  const isDirNamed = !!(dirDest && !dirCoord);

  const fallbackName = 'Tujuan dari Google Maps';
  const name = (m2s && dec(m2s[1]))
    || (mPlace && dec(mPlace[1]))
    || (dirDest && !dirCoord ? dirDest : '')
    || (qVal && !qCoord ? qVal : '')
    || fallbackName;

  // ── Koordinat, dari paling akurat ke paling kasar ─────────────────────
  const pairs = [...s.matchAll(new RegExp(`!3d(${MAPS_NUM})!4d(${MAPS_NUM})`, 'g'))];
  let lat, lng, exact = false;

  if (pairs.length) {
    lat = parseFloat(pairs[0][1]);
    lng = parseFloat(pairs[0][2]);
    // Lebih dari satu pair = ambigu (mis. pencarian lintas area), bukan satu
    // pin. Tetap pakai yang pertama, tapi jangan diklaim 'persis'.
    exact = pairs.length === 1;
  } else {
    // Koordinat eksplisit lebih akurat daripada '@', jadi dicek lebih dulu.
    if (dirCoord) { lat = dirCoord.lat; lng = dirCoord.lng; exact = true; }
    else if (qCoord) { lat = qCoord.lat;  lng = qCoord.lng;  exact = true; }
    else {
      // '@lat,lng' adalah pusat viewport, bukan pin. Regex berhenti sebelum
      // zoom supaya '@lat,lng,17z' tidak ikut memakan angka zoom.
      //
      // TAPI jangan pakai '@' kalau tujuan /dir/ berupa NAMA: pada URL
      // directions, viewport berada di TENGAH rute, bukan di tujuan. Memakainya
      // akan merute ke tengah perjalanan — lebih buruk daripada gagal.
      const at = isDirNamed
        ? null
        : s.match(new RegExp(`@(${MAPS_NUM}),(${MAPS_NUM})(?:,|$)`));
      if (at) { lat = parseFloat(at[1]); lng = parseFloat(at[2]); exact = false; }
      else return (name !== fallbackName)
        ? { ok: false, reason: 'needs-geocode', name }
        : { ok: false, reason: 'no-coords' };
    }
  }

  if (!validLatLng(lat, lng)) return { ok: false, reason: 'no-coords' };
  return { ok: true, lat, lng, name, exact };
}

// ══════════════════════════════════════════════
//  KONFIRMASI TUJUAN DARI LINK
// ══════════════════════════════════════════════
const confirmEl = document.getElementById('maps-confirm');

function hideConfirm() { confirmEl.style.display = 'none'; }

function showConfirm(res) {
  confirmEl.innerHTML = '';

  const nameEl = document.createElement('div');
  nameEl.className = 'mc-name';
  nameEl.textContent = res.name;

  const coordEl = document.createElement('div');
  coordEl.className = 'mc-coord';
  coordEl.textContent = res.lat.toFixed(5) + ', ' + res.lng.toFixed(5);

  // '!3d/!4d' = pin asli. '@' = pusat layar Google Maps yang bisa jauh dari
  // pin, jadi koordinat seperti itu tidak boleh tampil tanpa label peringatan.
  const tagEl = document.createElement('span');
  tagEl.className = res.exact ? 'mc-tag' : 'mc-tag approx';
  tagEl.textContent = res.exact ? 'persis' : 'perkiraan — pusat layar Google Maps';

  const actions = document.createElement('div');
  actions.className = 'mc-actions';

  const useBtn = document.createElement('button');
  useBtn.className = 'primary';
  useBtn.textContent = 'Pakai tujuan ini';
  useBtn.addEventListener('click', () => {
    hideConfirm();
    suggestionsEl.style.display = 'none';
    searchInput.value = res.name;
    selectDestination(res.lat, res.lng, res.name);
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Batal';
  cancelBtn.addEventListener('click', () => {
    hideConfirm();
    searchInput.value = '';
  });

  actions.append(useBtn, cancelBtn);
  confirmEl.append(nameEl, coordEl, tagEl, actions);
  confirmEl.style.display = 'block';
  suggestionsEl.style.display = 'none';
}

// Sengaja TIDAK memanggil selectDestination langsung. Aplikasi ini dipakai
// sambil mengendarai, dan tujuan yang salah akan mengarahkan ke tempat keliru
// di jalan. Baris konfirmasi memaksa user melambat dan membaca dulu.
function handleMapsInput(text) {
  const res = parseMapsLink(text);
  if (res.ok) { showConfirm(res); return true; }
  if (res.reason === 'short-link') {
    hideConfirm();
    toast('Link pendek tidak bisa dibaca. Pasang bookmark 🔗 di panel atas untuk kirim sekali-tap.');
    return true;
  }
  if (res.reason === 'needs-geocode' && res.name) {
    hideConfirm();
    searchInput.value = res.name;
    fetchSuggestions(res.name);
    return true;
  }
  return false; // teks biasa — biarkan jalur Nominatim yang sudah ada
}

searchInput.addEventListener('paste', e => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (handleMapsInput(text)) e.preventDefault();
});

searchInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (handleMapsInput(searchInput.value)) e.preventDefault();
});

// ══════════════════════════════════════════════
//  BOOKMARKLET: KIRIM DARI GOOGLE MAPS
// ══════════════════════════════════════════════
//
// Short link (maps.app.goo.gl) tidak bisa di-expand dari browser karena CORS
// melarang JavaScript membaca jawaban server Google. Tapi bookmarklet tidak
// melakukan fetch sama sekali: dia membaca location.href dari halaman yang
// SEDANG dibuka, jadi tidak ada request lintas domain dan CORS tidak pernah
// tersentuh. Batas yang menutup fitur di atas justru hilang total di sini.
//
// URL dikirim lewat FRAGMENT (#u=), bukan query string (?u=), supaya tujuan
// yang dipilih user tidak pernah masuk ke access log server hosting.
//
// Alur: Google Maps → tap bookmark → tab baru terbuka ke aplikasi ini dengan
// koordinat tujuan terisi → baris konfirmasi muncul → user menyetujui.

function buildBookmarklet(appUrl) {
  const base = String(appUrl || '').replace(/\/+$/, '');
  return 'javascript:(function(){window.open('
       + JSON.stringify(base + '#u=')
       + '+encodeURIComponent(location.href))})()';
}

function readIncomingLink() {
  const hash = location.hash.replace(/^#/, '');
  if (!hash) return null;
  try { return new URLSearchParams(hash).get('u'); } catch { return null; }
}

// Buang fragment setelah dibaca supaya refresh tidak memicu parse ulang dan
// URL di address bar tetap bersih.
function cleanIncomingLink() {
  if (!location.hash) return;
  history.replaceState(null, '', location.pathname + location.search);
}

const bmPanel = document.getElementById('bookmarklet-panel');
const bmCode  = document.getElementById('bookmarklet-code');

function toggleBookmarkletPanel(force) {
  const open = force !== undefined ? force : bmPanel.style.display !== 'block';
  if (open) bmCode.value = buildBookmarklet(location.origin);
  bmPanel.style.display = open ? 'block' : 'none';
  document.getElementById('btn-bookmarklet').classList.toggle('active', open);
}

document.getElementById('btn-bookmarklet').addEventListener('click', () => toggleBookmarkletPanel());
document.getElementById('btn-close-bm').addEventListener('click', () => toggleBookmarkletPanel(false));
document.getElementById('btn-copy-bm').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(bmCode.value);
    toast('Kode tersalin. Simpan sebagai bookmark "Kirim ke ESP-Nav".');
  } catch {
    // Clipboard API butuh konteks aman; kalau gagal, andalkan selection manual.
    bmCode.focus();
    bmCode.select();
    toast('Tekan Ctrl+C untuk menyalin kode yang tersorot.');
  }
});

// ══════════════════════════════════════════════
//  SIMPAN PERJALANAN (bertahan saat refresh)
// ══════════════════════════════════════════════
//
// sessionStorage, bukan localStorage: harus selamat dari refresh DAN crash,
// tapi harus hilang begitu tab ditutup. Kalau localStorage, membuka aplikasi
// esok hari akan menghidupkan kembali tujuan dari kemarin.
const TRIP_KEY = 'esp32nav.trip';

function saveTrip() {
  try {
    if (state.destLat === null || state.destLng === null) return;
    sessionStorage.setItem(TRIP_KEY, JSON.stringify({
      lat: state.destLat, lng: state.destLng,
      name: state.destName, step: state.currentStep,
    }));
  } catch { /* storage penuh / private mode: bukan alasan gagalkan navigasi */ }
}

function loadTrip() {
  try {
    const raw = sessionStorage.getItem(TRIP_KEY);
    if (!raw) return null;
    const t = JSON.parse(raw);
    if (!t || !validLatLng(t.lat, t.lng)) { clearStoredTrip(); return null; }
    return t;
  } catch { return null; }
}

function clearStoredTrip() {
  try { sessionStorage.removeItem(TRIP_KEY); } catch { /* abaikan */ }
}

// Refresh di tengah perjalanan tidak boleh menghapus tujuan. GPS/BLE/wake
// lock sengaja TIDAK dipulihkan: semuanya butuh user gesture, dan
// memulihkannya diam-diam akan menghasilkan state navigasi yang rusak.
async function restoreTrip() {
  const t = loadTrip();
  if (!t) return;

  state.destLat = t.lat;
  state.destLng = t.lng;
  state.destName = t.name || 'Tujuan';
  searchInput.value = state.destName;

  if (state.destMarker) state.destMarker.setLatLng([t.lat, t.lng]);
  else state.destMarker = L.marker([t.lat, t.lng], { icon: destIcon }).addTo(map);

  if (!state.userLat) {
    toast('Tujuan dipulihkan. Aktifkan GPS untuk menghitung rute.');
    return;
  }
  setInstruction('⏳', 'Menghitung rute...');
  await fetchRoute();

  // Clamp: rute hasil hitung ulang bisa lebih pendek, currentStep tidak boleh
  // keluar rentang.
  if (state.steps.length) {
    state.currentStep = Math.min(t.step || 0, state.steps.length - 1);
    showNavControls();
    updateInstructionUI();
  }
}

// ══════════════════════════════════════════════
//  ROUTING / OSRM
// ══════════════════════════════════════════════
async function selectDestination(lat, lng, name) {
  state.destLat = lat; state.destLng = lng;
  state.destName = name || 'Tujuan';
  state.currentStep = 0;
  saveTrip();

  if (state.destMarker) state.destMarker.setLatLng([lat, lng]);
  else state.destMarker = L.marker([lat, lng], { icon: destIcon }).addTo(map);

  if (!state.userLat) { toast('Aktifkan GPS dulu'); return; }

  setInstruction('⏳', 'Menghitung rute...');
  await fetchRoute();
}

async function fetchRoute() {
  const { userLat: oLat, userLng: oLng, destLat: dLat, destLng: dLng } = state;
  if (!oLat || !dLat) return;

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${oLng},${oLat};${dLng},${dLat}?steps=true&geometries=geojson&overview=full&annotations=false`;
    const res  = await fetch(url);
    const data = await res.json();

    if (data.code !== 'Ok') { toast('Rute tidak ditemukan'); return; }

    const route = data.routes[0];
    drawRoute(route.geometry.coordinates);
    parseSteps(route.legs[0].steps);
    showRouteInfo(route.distance, route.duration);
    showNavControls();
    fitRoute(route.geometry.coordinates);
  } catch { toast('Gagal mengambil rute'); }
}

function drawRoute(coords) {
  if (state.routeLayer) map.removeLayer(state.routeLayer);
  const latlngs = coords.map(([lng, lat]) => [lat, lng]);
  state.routeLayer = L.polyline(latlngs, {
    color: '#4f8ef7', weight: 5, opacity: 0.85,
    lineCap: 'round', lineJoin: 'round',
  }).addTo(map);
}

function fitRoute(coords) {
  const latlngs = coords.map(([lng, lat]) => [lat, lng]);
  map.fitBounds(L.latLngBounds(latlngs), { padding: [40, 40] });
}

function parseSteps(rawSteps) {
  state.steps = rawSteps.map(s => {
    const loc = s.maneuver.location; // [lng, lat]
    return {
      lat: loc[1], lng: loc[0],
      instruction: cleanInstruction(s.maneuver.type, s.maneuver.modifier, s.name),
      icon: maneuverIcon(s.maneuver.type, s.maneuver.modifier),
      code: maneuverCode(s.maneuver.type, s.maneuver.modifier),
      distance: s.distance,
    };
  });
  state.currentStep = 0;
  updateInstructionUI();
}

function cleanInstruction(type, modifier, name) {
  const road = name && name !== '' ? ` ke ${name}` : '';
  if (type === 'depart') return `Mulai perjalanan${road}`;
  if (type === 'arrive') return 'Anda telah tiba di tujuan';
  if (type === 'turn') {
    if (modifier === 'left')       return `Belok kiri${road}`;
    if (modifier === 'right')      return `Belok kanan${road}`;
    if (modifier === 'slight left')  return `Sedikit belok kiri${road}`;
    if (modifier === 'slight right') return `Sedikit belok kanan${road}`;
    if (modifier === 'sharp left')   return `Belok tajam kiri${road}`;
    if (modifier === 'sharp right')  return `Belok tajam kanan${road}`;
    if (modifier === 'uturn')        return `Putar balik${road}`;
  }
  if (type === 'roundabout') return `Masuk bundaran${road}`;
  if (type === 'merge')      return `Gabung ke jalan${road}`;
  if (type === 'fork') {
    if (modifier === 'left')  return `Ambil kiri di persimpangan${road}`;
    if (modifier === 'right') return `Ambil kanan di persimpangan${road}`;
  }
  return `Lanjutkan${road}`;
}

function maneuverIcon(type, modifier) {
  if (type === 'depart') return '🚦';
  if (type === 'arrive') return '🏁';
  if (type === 'roundabout') return '🔄';
  if (modifier === 'left' || modifier === 'sharp left') return '⬅️';
  if (modifier === 'right' || modifier === 'sharp right') return '➡️';
  if (modifier === 'slight left') return '↖️';
  if (modifier === 'slight right') return '↗️';
  if (modifier === 'uturn') return '↩️';
  return '⬆️';
}

// Kode numerik yang dikirim ke ESP32 (0..12). HARUS sinkron dengan tabel
// ICON_* di esp32_nav.ino. Emoji di atas hanya untuk tampilan web.
function maneuverCode(type, modifier) {
  if (type === 'depart')    return 0;
  if (type === 'arrive')    return 11;
  // Semua varian bundaran/rotary dipetakan ke satu ikon.
  if (type === 'roundabout' || type === 'rotary' ||
      type === 'roundabout turn' || type === 'exit roundabout' ||
      type === 'exit rotary') return 9;
  // Ramp dan persimpangan ambil jalur gabungan/masuk.
  if (type === 'merge' || type === 'on ramp' || type === 'off ramp') return 10;
  if (modifier === 'uturn')         return 5;
  if (modifier === 'slight left')   return 2;
  if (modifier === 'left')          return 3;
  if (modifier === 'sharp left')    return 4;
  if (modifier === 'slight right')  return 6;
  if (modifier === 'right')         return 7;
  if (modifier === 'sharp right')   return 8;
  // "new name" = nama jalan berubah, tapi geometri tetap lurus.
  // cleanInstruction() juga jatuh ke "Lanjutkan", jadi ini konsisten.
  if (type === 'continue' || type === 'new name' || type === 'end of road') return 1;
  return 12;
}

function formatDist(m) {
  return m >= 1000 ? `${(m/1000).toFixed(1)} km` : `${Math.round(m)} m`;
}

function formatDur(s) {
  const m = Math.round(s / 60);
  return m >= 60 ? `${Math.floor(m/60)} jam ${m%60} mnt` : `${m} mnt`;
}

function showRouteInfo(dist, dur) {
  const el = document.getElementById('route-info');
  document.getElementById('info-dist').textContent = `📏 ${formatDist(dist)}`;
  document.getElementById('info-dur').textContent  = `⏱ ${formatDur(dur)}`;
  el.classList.add('visible');
}

function showNavControls() {
  document.getElementById('nav-controls').classList.add('visible');
}

// ══════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════
document.getElementById('btn-start').addEventListener('click', startNavigation);
document.getElementById('btn-stop').addEventListener('click', stopNavigation);

function startNavigation() {
  if (!state.steps.length) { toast('Cari tujuan dulu'); return; }
  state.navigating = true;
  state.currentStep = 0;
  saveTrip();
  updateInstructionUI();
  const first = currentInstructionPayload();
  if (first) sendToBLE(first.code, first.text, first.dist);

  // Jaga layar tetap menyala. Sengaja TIDAK di-await supaya
  // startNavigation tetap sinkron dan request() tetap dijalankan di dalam
  // task gesture dari klik tombol.
  requestWakeLock();

  // Watch GPS
  if (navigator.geolocation) {
    state.watchId = navigator.geolocation.watchPosition(pos => {
      setUserPos(pos.coords.latitude, pos.coords.longitude);
    }, null, { enableHighAccuracy: true, maximumAge: 2000 });
  }

  toast('Navigasi dimulai');
}

function stopNavigation() {
  state.navigating = false;
  if (state.watchId !== null) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
  releaseWakeLock();
  setInstruction('🗺️', 'Navigasi dihentikan');
  toast('Navigasi dihentikan');
}

// Instruksi yang sedang aktif, dipakai untuk UI web dan payload BLE.
function currentInstructionPayload() {
  const s = state.steps[state.currentStep];
  if (!s) return null;
  return { code: s.code, text: s.instruction, dist: s.distance };
}

function updateInstructionUI() {
  const s = state.steps[state.currentStep];
  if (!s) return;
  setInstruction(s.icon, s.instruction, formatDist(s.distance));
  // Persistensi langkah: user supaya setelah refresh tidak melempar mundur
  // ke manifold pertama di tengah perjalanan.
  saveTrip();
}

function setInstruction(icon, text, dist = '') {
  document.getElementById('instr-icon').textContent = icon;
  document.getElementById('instr-text').textContent = text;
  document.getElementById('instr-dist').textContent = dist;
}

function checkStepProgress(lat, lng) {
  const step = state.steps[state.currentStep];
  if (!step) return;
  const dist = haversine(lat, lng, step.lat, step.lng);
  if (dist < 25) { // within 25m → next step
    state.currentStep++;
    if (state.currentStep >= state.steps.length) {
      stopNavigation();
      setInstruction('🏁', 'Anda telah tiba!');
      sendToBLE(11, 'Anda telah tiba di tujuan', -1);
      return;
    }
    updateInstructionUI();
    const next = currentInstructionPayload();
    if (next) sendToBLE(next.code, next.text, next.dist);
  }
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ══════════════════════════════════════════════
//  BLE
// ══════════════════════════════════════════════
const bleBtn   = document.getElementById('btn-ble');
const bleDot   = document.getElementById('ble-dot');
const bleLabel = document.getElementById('ble-label');

bleBtn.addEventListener('click', async () => {
  if (state.bleDevice && state.bleDevice.gatt.connected) {
    state.bleDevice.gatt.disconnect();
    onBLEDisconnect();
    return;
  }
  if (!navigator.bluetooth) {
    toast('Browser ini tidak mendukung Web Bluetooth. Pakai Chrome Android.');
    return;
  }
  try {
    setBLEStatus('connecting');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'ESP32-NAV' }],
      optionalServices: [SERVICE_UUID],
    });
    state.bleDevice = device;
    device.addEventListener('gattserverdisconnected', onBLEDisconnect);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    state.bleChar  = await service.getCharacteristic(CHAR_UUID);
    setBLEStatus('connected', device.name);
    toast('ESP32 terhubung!');
  } catch (e) {
    setBLEStatus('disconnected');
    if (e.name !== 'NotFoundError') toast('Gagal konek: ' + e.message);
  }
});

function onBLEDisconnect() {
  state.bleChar = null;
  setBLEStatus('disconnected');
  toast('ESP32 terputus');
}

function setBLEStatus(status, name = '') {
  bleDot.className = '';
  if (status === 'connected') {
    bleDot.classList.add('connected');
    bleLabel.textContent = `Terhubung: ${name}`;
    bleBtn.textContent = 'Putuskan';
    bleBtn.classList.add('connected');
  } else if (status === 'connecting') {
    bleDot.classList.add('connecting');
    bleLabel.textContent = 'Menghubungkan...';
    bleBtn.textContent = 'Batal';
    bleBtn.classList.remove('connected');
  } else {
    bleLabel.textContent = 'ESP32 belum terhubung';
    bleBtn.textContent = 'Hubungkan';
    bleBtn.classList.remove('connected');
  }
}

// ══════════════════════════════════════════════
//  BLE WRITE
//
//  Protokol (HARUS sinkron dengan esp32_nav.ino):
//      V1|<icon>|<dist_m>|<text>\n
//
//  onWrite() di firmware dipanggil SEKALI PER WRITE, jadi satu pesan
//  harus dikirim sebagai rangkaian write berurutan dan diakhiri newline.
//  Tanpa newline firmware tidak akan menggambar apa pun.
// ══════════════════════════════════════════════
const BLE_CHUNK_SIZE = 20;  // muat pada MTU default 23 (3 byte header)
const TEXT_MAX = 40;        // sama dengan TEXT_MAX di firmware
const ICON_MAX = 12;

// Sanitasi defensif: firmware juga menyaring, tapi di sini kita menjamin
// payload 100% ASCII sehingga pemotongan per 20 byte tidak pernah memecah
// karakter multi-byte di tengah chunk.
function sanitizeForBLE(text) {
  return String(text)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\x20-\x7E]/g, ' ')
    .replace(/[|\r\n\t]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, TEXT_MAX);
}

function clampCode(c) {
  const n = Math.round(Number(c));
  if (!Number.isFinite(n) || n < 0 || n > ICON_MAX) return 12;
  return n;
}

function normalizeDist(d) {
  const n = Math.round(Number(d));
  return Number.isFinite(n) ? n : -1;
}

// Rantai antrean: satu pesan selesai sebelum yang berikutnya mulai, supaya
// dua write tidak pernah saling menimpa di tengah chunk.
let bleSendChain = Promise.resolve();

async function writeChunks(bytes) {
  for (let i = 0; i < bytes.length; i += BLE_CHUNK_SIZE) {
    const chunk = bytes.slice(i, i + BLE_CHUNK_SIZE);
    const ch = state.bleChar;
    if (!ch) return;
    if (typeof ch.writeValueWithResponse === 'function') {
      await ch.writeValueWithResponse(chunk);
    } else {
      await ch.writeValue(chunk);
    }
  }
}

function sendToBLE(code, text, distMeters = -1) {
  if (!state.bleChar) return Promise.resolve();
  const payload = `V1|${clampCode(code)}|${normalizeDist(distMeters)}|${sanitizeForBLE(text)}\n`;
  const bytes = new TextEncoder().encode(payload);
  bleSendChain = bleSendChain
    .then(() => writeChunks(bytes))
    .catch(e => { console.error('BLE write error:', e); });
  return bleSendChain;
}

// ══════════════════════════════════════════════
//  WAKE LOCK
//
//  Selama navigasi, layar HP harus tetap menyala. Kalau tidak, Chrome
//  membuat tab ter-background, watchPosition di-throttle lalu berhenti,
//  dan OLED membeku pada instruksi terakhir — tanpa indikator apa pun
//  bahwa instruksi itu sudah basi.
//
//  Batasnya, dan ini penting: Screen Wake Lock hanya mencegah timeout
//  layar. Kalau pengguna pindah ke aplikasi lain atau mengunci HP manual,
//  lock tetap dilepas oleh sistem dan navigasi bisa terputus. Jadi ini
//  memperbaiki kasus yang paling sering, bukan semua kasus.
// ══════════════════════════════════════════════
// WAV senyap 0,1 detik dibangun saat runtime, bukan blob base64 sepanjang
// 1 KB di dalam source: string sebesar itu gampang rusak saat diedit dan
// mustahil dibaca atau ditinjau.
function silentWavDataUri() {
  const RATE = 8000, FRAMES = 800, CHANNELS = 1, BITS = 8;
  const dataSize = FRAMES * CHANNELS * (BITS / 8);
  const buf = new ArrayBuffer(44 + dataSize);
  const v = new DataView(buf);
  const tag = (off, s) => {
    for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i));
  };
  tag(0, 'RIFF');
  v.setUint32(4, 36 + dataSize, true);
  tag(8, 'WAVE');
  tag(12, 'fmt ');
  v.setUint32(16, 16, true);                          // panjang chunk fmt
  v.setUint16(20, 1, true);                           // PCM tak terkompresi
  v.setUint16(22, CHANNELS, true);
  v.setUint32(24, RATE, true);
  v.setUint32(28, RATE * CHANNELS * BITS / 8, true);  // byte per detik
  v.setUint16(32, CHANNELS * BITS / 8, true);         // block align
  v.setUint16(34, BITS, true);
  tag(36, 'data');
  v.setUint32(40, dataSize, true);
  // ArrayBuffer tidak punya fill(); fill() itu metode TypedArray
  const bytes = new Uint8Array(buf);
  bytes.fill(128, 44);                              // 128 = hening 8-bit
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}

let keepAwakeAudio = null;          // hanya untuk fallback
let releasingIntentionally = false; // bedsakan "kita lepas" vs "sistem lepas"

function setAwakeNote(msg, warn = false) {
  const el = document.getElementById('awake-note');
  if (!el) return;
  if (!msg) {
    el.classList.add('hidden');
    el.classList.remove('warn');
    return;
  }
  el.textContent = msg;
  el.classList.remove('hidden');
  el.classList.toggle('warn', warn);
}

function stopKeepAwakeFallback() {
  if (!keepAwakeAudio) return;
  try { keepAwakeAudio.pause(); } catch (e) { /* abaikan */ }
  keepAwakeAudio = null;
}

// Fallback HANYA untuk browser tanpa Screen Wake Lock API. Cara lama ini
// sudah usang: browser modern sering memblokir audio senyap, dan tetap saja
// membuat baterai terkuras. Dipakai sebagai upaya terakhir, bukan utama.
function startKeepAwakeFallback() {
  if (keepAwakeAudio) return;
  try {
    const audio = new Audio(silentWavDataUri());
    audio.loop = true;
    audio.volume = 0.01;
    const played = audio.play();
    if (played && played.catch) played.catch(() => {});
    keepAwakeAudio = audio;
    setAwakeNote('Layar dijaga (mode kompatibilitas, boros baterai).');
  } catch (e) {
    console.warn('[AWAKE] fallback gagal:', e);
    setAwakeNote('Tidak bisa menjaga layar tetap menyala. Navigasi bisa terputus saat tab tidak aktif.', true);
  }
}

async function requestWakeLock() {
  if (!state.navigating) return;
  if (!('wakeLock' in navigator)) { startKeepAwakeFallback(); return; }

  // Jangan acquire dua kali: satu sentinel hanya bisa dipakai sekali.
  if (state.wakeLock && !state.wakeLock.released) return;

  try {
    const sentinel = await navigator.wakeLock.request('screen');
    if (!state.navigating) { sentinel.release().catch(() => {}); return; }
    state.wakeLock = sentinel;
    setAwakeNote('Layar dijaga — layar tidak akan padam selama navigasi.');
    sentinel.addEventListener('release', () => {
      state.wakeLock = null;
      if (state.navigating && !releasingIntentionally) {
        setAwakeNote('Layar tidak lagi dijaga. Navigasi bisa berhenti kalau tab dibekukan browser.', true);
      }
    });
  } catch (e) {
    // Ditolak karena battery saver, baterai lemah, atau dokumen tidak
    // visible. Harus terlihat: kalau diam saja, pengguna tidak akan tahu
    // navigasinya bisa mati.
    console.warn('[AWAKE] wake lock ditolak:', e);
    setAwakeNote('Tidak bisa menjaga layar tetap menyala. Navigasi bisa terputus saat tab tidak aktif.', true);
  }
}

function releaseWakeLock() {
  const sentinel = state.wakeLock;
  state.wakeLock = null;
  if (sentinel) {
    releasingIntentionally = true;
    try { sentinel.release().catch(() => {}); } catch (e) { /* abaikan */ }
    // Bendera hanya untuk menahan event 'release' yang menyertainya.
    setTimeout(() => { releasingIntentionally = false; }, 0);
  }
  stopKeepAwakeFallback();
  setAwakeNote('');
}

function handleVisibilityChange() {
  if (document.visibilityState !== 'visible') return;
  if (!state.navigating) return;
  if (state.wakeLock) return;
  // Sistem melepas lock sendiri saat halaman jadi hidden, jadi di sini
  // kita minta yang baru.
  requestWakeLock();
}

document.addEventListener('visibilitychange', handleVisibilityChange);
window.addEventListener('pagehide', releaseWakeLock);

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// Dipanggil terakhir, setelah semua fungsi di atas terdefinisi.
//
// Kalau halaman dibuka dari bookmarklet, tidak ada yang dipulihkan: tautan yang
// barusan dikirim adalah niat eksplisit user dan harus menang atas perjalanan
// yang tersimpan sebelumnya. Kalau tidak, kembalikan perjalanan yang lalu.
const incomingLink = readIncomingLink();
if (incomingLink) {
  cleanIncomingLink();
  handleMapsInput(incomingLink);
} else {
  restoreTrip();
}
</script>
